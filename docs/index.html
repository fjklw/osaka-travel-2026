  body {
    margin: 0;
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--accent), #8e2a1f);
    color: #fff;
    padding: 28px 16px 20px;
    text-align: center;
  }
  header h1 { margin: 0 0 6px; font-size: 1.4rem; }
  header p { margin: 0; opacity: 0.9; font-size: 0.9rem; }

  nav#dayTabs {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 10px 10px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    -webkit-overflow-scrolling: touch;
  }
  nav#dayTabs button {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    white-space: nowrap;
    cursor: pointer;
  }
  nav#dayTabs button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  main { max-width: 720px; margin: 0 auto; padding: 16px; }

  .day-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 4px 0 14px;
    color: var(--accent);
  }

  .timeline { position: relative; padding-left: 22px; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 6px;
    bottom: 6px;
    width: 2px;
    background: var(--border);
  }

  .stop { position: relative; margin-bottom: 16px; }
  .stop::before {
    content: "";
    position: absolute;
    left: -22px;
    top: 4px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent2);
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--accent2);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .card .time {
    font-weight: 700;
    color: var(--accent2);
    font-size: 0.85rem;
  }
  .card .place {
    font-weight: 700;
    margin: 2px 0 4px;
    font-size: 1rem;
  }
  .card .activity {
    font-size: 0.92rem;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .meta-row span.tag {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
  }
  .memo {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.4;
  }

  .day-summary {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .day-summary b { color: var(--text); }

  footer {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    padding: 24px 16px 40px;

</style>

const tabsEl = document.getElementById('dayTabs');
const contentEl = document.getElementById('content');

function fmtCost(n) {
  return n > 0 ? `¥${n.toLocaleString()}` : '무료';
}

function renderDay(idx) {
  const d = itinerary[idx];
  const dayTotal = d.stops.reduce((sum, s) => sum + s.cost, 0);

  [...tabsEl.children].forEach((btn, i) => btn.classList.toggle('active', i === idx));

  const stopsHtml = d.stops.map(s => `
    <div class="stop">
      <div class="card">
        <div class="time">${s.time}</div>
        <div class="place">📍 ${s.place}</div>
        <div class="activity">${s.activity}</div>
        <div class="meta-row">
          <span class="tag">🚃 ${s.move}</span>
          <span class="tag">💴 ${fmtCost(s.cost)}</span>
        </div>
        ${s.memo ? `<div class="memo">${s.memo}</div>` : ''}
      </div>
    </div>
  `).join('');

  contentEl.innerHTML = `
    <div class="day-title">${d.day} · ${d.date} — ${d.title}</div>
    <div class="day-summary"><span>이 날 이동·활동 예상 비용</span><b>${fmtCost(dayTotal)}</b></div>
    <div class="timeline">${stopsHtml}</div>
  `;
}

itinerary.forEach((d, i) => {
  const btn = document.createElement('button');
  btn.textContent = `${d.day} ${d.date.split(' ')[0]}`;
  btn.addEventListener('click', () => renderDay(i));
  tabsEl.appendChild(btn);
});

renderDay(0);
</script>

</body>
</html>
