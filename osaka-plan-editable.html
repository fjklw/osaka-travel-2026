<title>오사카 여행 — 편집 가능 플래너</title>
<style>
:root{--ground:#F4F2EC;--paper:#fff;--text:#1B2330;--muted:#6E727B;--accent:#D6402F;--accent2:#1E4E68;--line:#1b23301f;--ok:#1f8a4c;--kr:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--kr);line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 90px}
a{color:var(--accent2)}
.bar{position:sticky;top:0;z-index:50;background:var(--text);color:#fff;margin:0 -12px;padding:9px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .t{font-weight:800;font-size:14px}.bar .t b{background:var(--accent);padding:1px 7px;border-radius:5px;margin-right:6px}
.bar .save{font-size:12px;color:#9fe7b8;margin-left:auto;font-weight:700}
.bar button{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:8px;background:#ffffff22;color:#fff;padding:5px 10px;cursor:pointer}
.bar button.p{background:var(--accent)}
.note{background:#fff;border-left:4px solid var(--accent2);border-radius:0 10px 10px 0;padding:9px 12px;font-size:12px;font-weight:600;margin:14px 0}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}.daytabs::-webkit-scrollbar{display:none}
.dtab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);border-radius:11px;padding:6px 11px;cursor:pointer;font:inherit;text-align:left;min-width:88px}
.dtab .d{font-weight:900;font-size:13px}.dtab .dd{font-size:10.5px;color:var(--muted);font-weight:700}
.dtab[aria-selected=true]{background:var(--text);border-color:var(--text)}.dtab[aria-selected=true] .d{color:#fff}.dtab[aria-selected=true] .dd{color:#fff9}
.sec-h{font-size:18px;font-weight:900;margin:26px 0 10px;border-bottom:2px solid var(--text);padding-bottom:5px}
.row{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:9px}
.row .r1{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.row input.time{width:84px;font-family:var(--mono);font-weight:700;color:var(--accent)}
.row input.place{flex:1;font-weight:800}
.row .acts{margin-left:auto;display:flex;gap:3px}
.row .acts button{border:0;background:#1b23300d;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:13px}
.row .acts button.del{background:#d6402f1a;color:var(--accent)}
.row textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;resize:vertical;background:#fafafa}
.row textarea.act{font-size:14px;font-weight:600;min-height:34px}
.row textarea.memo{font-size:12px;color:var(--muted);min-height:30px;margin-top:5px}
.row input{border:1px solid transparent;border-radius:6px;padding:4px 6px;font:inherit;background:#fafafa}
.row input:focus,.row textarea:focus{outline:2px solid var(--accent2);background:#fff}
.add{width:100%;border:1.5px dashed var(--accent2);background:#1e4e6b0d;color:var(--accent2);font:inherit;font-weight:800;border-radius:10px;padding:10px;cursor:pointer}
textarea#notes{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--paper);resize:vertical}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:9px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px}
.chk input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:2px solid var(--text);border-radius:5px;flex:0 0 auto;cursor:pointer}
.chk input:checked{background:var(--accent);border-color:var(--accent)}.chk input:checked::after{content:"✓";color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;height:100%}
.chk .ctext{flex:1;border:0;background:transparent;font:inherit}
.chk li.done .ctext{opacity:.45;text-decoration:line-through}
.chk .del{border:0;background:#d6402f1a;color:var(--accent);border-radius:6px;width:26px;height:26px;cursor:pointer}
.pass{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.pass .top{display:flex;justify-content:space-between;gap:8px}.pass .nm{font-weight:800;font-size:13px}.pass .pr{font-family:var(--mono);font-weight:800;color:var(--accent2)}
.pass .u{font-size:11.5px;color:var(--muted);margin-top:2px}
.foot{margin-top:26px;background:var(--text);color:#fff;border-radius:12px;padding:16px;font-size:12.5px}.foot a{color:#fff;font-weight:800}
input[type=file]{display:none}
</style>
<div class="wrap">
 <div class="bar">
  <span class="t"><b>OSAKA</b>편집 플래너</span>
  <span class="save" id="save">✓ 저장됨</span>
  <button class="p" id="exp">⬇ 내보내기</button>
  <button id="imp">⬆ 불러오기</button>
  <button id="rst">↺ 초기화</button>
  <input type="file" id="file" accept="application/json,.json">
 </div>

 <h2 class="sec-h">✅ 체크리스트</h2>
 <ul class="chk" id="chk"></ul>
 <button class="add" id="addchk">+ 항목 추가</button>

const PASSES = [["Day2 6/22", "오사카 주유패스 1일권", "¥3,500", "오사카성·시텐노지·도톤보리크루즈·우메다스카이빌딩 무료"], ["Day3 6/23", "JR 간사이 에어리어 패스 1일", "¥2,800", "오사카→교토+후시미+비와호 코세이선"], ["Day4 6/24", "한큐 투어리스트 1일", "¥800", "우메다↔교토·아라시야마"], ["Day4 6/24", "교토 지하철·버스 1일권", "¥1,100", "기요미즈·기온 버스"], ["Day6 6/26", "메트로 Enjoy Eco Card", "¥820", "신세카이·미나미"], ["전 일정", "ICOCA", "¥2,000", "베이스 카드(보증금500+충전1,500)"]];
const KEY='osaka-plan-edit-v1';
let state, curDay=0, t=null;
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}; const el=document.getElementById('save'); el.textContent='✓ 저장됨'; el.style.color='#9fe7b8'}
function touch(){clearTimeout(t); const el=document.getElementById('save'); el.textContent='저장 중…'; el.style.color='#ffd';
  t=setTimeout(save,400)}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

state = load() || JSON.parse(JSON.stringify(INITIAL));

function renderTabs(){
 const w=document.getElementById('daytabs'); w.innerHTML='';
 state.days.forEach((d,i)=>{const b=document.createElement('button');b.className='dtab';b.setAttribute('aria-selected',i===curDay);
  b.innerHTML='<div class="d">'+esc(d.day)+'</div><div class="dd">'+esc(d.date)+'</div>';
  b.onclick=()=>{curDay=i;renderTabs();renderDay()};w.appendChild(b)});
}
function renderDay(){
 const d=state.days[curDay]; const w=document.getElementById('daybody'); w.innerHTML='';
 d.rows.forEach((r,idx)=>{
  const div=document.createElement('div');div.className='row';
  div.innerHTML=
   '<div class="r1"><input class="time" value="'+esc(r.time)+'" data-f="time" placeholder="시간">'+
   '<input class="place" value="'+esc(r.place)+'" data-f="place" placeholder="장소">'+
   '<span class="acts"><button data-a="up">↑</button><button data-a="down">↓</button><button class="del" data-a="del">🗑</button></span></div>'+
   '<textarea class="act" data-f="act" placeholder="활동 내용">'+esc(r.act)+'</textarea>'+
   '<textarea class="memo" data-f="memo" placeholder="메모·이동·비용">'+esc(r.memo)+'</textarea>';
  div.querySelectorAll('[data-f]').forEach(inp=>inp.addEventListener('input',()=>{r[inp.dataset.f]=inp.value;touch()}));
  div.querySelectorAll('[data-a]').forEach(btn=>btn.addEventListener('click',()=>{
    const a=btn.dataset.a;
    if(a==='del'){if(confirm('이 일정을 삭제할까요?')){d.rows.splice(idx,1);touch();renderDay()}}
    else if(a==='up'&&idx>0){[d.rows[idx-1],d.rows[idx]]=[d.rows[idx],d.rows[idx-1]];touch();renderDay()}
    else if(a==='down'&&idx<d.rows.length-1){[d.rows[idx+1],d.rows[idx]]=[d.rows[idx],d.rows[idx+1]];touch();renderDay()}
  }));
  w.appendChild(div);
 });
 const add=document.createElement('button');add.className='add';add.textContent='+ 일정 추가';
 add.onclick=()=>{d.rows.push({time:'',place:'',act:'',memo:''});touch();renderDay()};
 w.appendChild(add);
}
function renderChk(){
 const w=document.getElementById('chk');w.innerHTML='';
 state.checklist.forEach((c,idx)=>{
  const li=document.createElement('li');if(c.done)li.className='done';
  li.innerHTML='<input type="checkbox" '+(c.done?'checked':'')+'><input class="ctext" value="'+esc(c.text)+'"><button class="del">🗑</button>';
  li.querySelector('input[type=checkbox]').addEventListener('change',e=>{c.done=e.target.checked;li.classList.toggle('done',c.done);touch()});
  li.querySelector('.ctext').addEventListener('input',e=>{c.text=e.target.value;touch()});
  li.querySelector('.del').addEventListener('click',()=>{state.checklist.splice(idx,1);touch();renderChk()});
  w.appendChild(li);
 });
}
function renderPasses(){
 document.getElementById('passes').innerHTML=PASSES.map(p=>'<div class="pass"><div class="top"><span class="nm">'+esc(p[1])+'</span><span class="pr">'+esc(p[2])+'</span></div><div class="u">'+esc(p[0])+' · '+esc(p[3])+'</div></div>').join('');
}
const notes=document.getElementById('notes');
notes.value=state.notes||'';
notes.addEventListener('input',()=>{state.notes=notes.value;touch()});
document.getElementById('addchk').onclick=()=>{state.checklist.push({text:'',done:false});touch();renderChk()};
document.getElementById('exp').onclick=()=>{
 const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='osaka-plan.json';a.click();
};
document.getElementById('imp').onclick=()=>document.getElementById('file').click();
document.getElementById('file').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{state=JSON.parse(rd.result);save();curDay=0;renderTabs();renderDay();renderChk();notes.value=state.notes||'';alert('불러왔습니다 ✓')}catch(err){alert('파일을 읽을 수 없어요')}};
 rd.readAsText(f);
});
document.getElementById('rst').onclick=()=>{if(confirm('처음 상태로 되돌릴까요? (현재 수정 내용 사라짐)')){state=JSON.parse(JSON.stringify(INITIAL));save();curDay=0;renderTabs();renderDay();renderChk();notes.value=''}};
renderTabs();renderDay();renderChk();renderPasses();
</script>
